<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание | Группа ИС-252/4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: rgba(18, 26, 43, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f0ff;
      --accent-magenta: #ff007f;
      --accent-purple: #7000ff;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image: 
        radial-gradient(circle at 20% 10%, rgba(112, 0, 255, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 30px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(0, 240, 255, 0.08);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Табы дней недели */
    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      padding: 10px 20px;
      font-size: 0.9rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .tab-btn:hover {
      border-color: rgba(0, 240, 255, 0.5);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-purple), #4f46e5);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
    }

    /* Инфо-панель дня */
    .day-info {
      width: 100%;
      max-width: 850px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Контейнер расписания */
    .schedule-container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .schedule-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .schedule-card:hover {
      border-color: rgba(0, 240, 255, 0.6);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px -10px rgba(0, 240, 255, 0.3);
    }

    .time-box {
      display: flex;
      flex-direction: column;
      min-width: 130px;
    }

    .time {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
    }

    .type-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    .type-lec { color: var(--accent-cyan); }
    .type-lab { color: #c084fc; }
    .type-prac { color: #34d399; }

    .details {
      flex-grow: 1;
      padding: 0 20px;
    }

    .event-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .event-teacher {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .room-tag {
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(0, 240, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.2);
      color: var(--accent-cyan);
      font-family: 'Space Grotesk', sans-serif;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 16px;
      color: var(--text-muted);
    }

    /* =============================================
       ГЛИТЧ-ЭФФЕКТ ДЛЯ КНОПОК ДНЕЙ И КАРТОЧЕК
    ============================================= */
    .glitch-btn {
      position: relative;
    }

    .glitch-btn::before,
    .glitch-btn::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-purple);
      opacity: 0;
    }

    .glitch-btn::before {
      left: 2px;
      text-shadow: -2px 0 var(--accent-cyan);
      background: #4f46e5;
    }

    .glitch-btn::after {
      left: -2px;
      text-shadow: -2px 0 var(--accent-magenta);
      background: var(--accent-purple);
    }

    .glitch-btn:hover::before {
      opacity: 1;
      animation: glitch-anim-1 0.3s infinite linear alternate-reverse;
    }

    .glitch-btn:hover::after {
      opacity: 1;
      animation: glitch-anim-2 0.3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip-path: inset(20% 0 50% 0); transform: translate(-3px, -1px); }
      20% { clip-path: inset(60% 0 10% 0); transform: translate(3px, 1px); }
      40% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 2px); }
      60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
      80% { clip-path: inset(30% 0 40% 0); transform: translate(-3px, 1px); }
      100% { clip-path: inset(50% 0 30% 0); transform: translate(1px, -1px); }
    }

    @keyframes glitch-anim-2 {
      0% { clip-path: inset(10% 0 60% 0); transform: translate(3px, 1px); }
      20% { clip-path: inset(40% 0 20% 0); transform: translate(-3px, -1px); }
      40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -2px); }
      60% { clip-path: inset(20% 0 50% 0); transform: translate(-1px, 2px); }
      80% { clip-path: inset(50% 0 30% 0); transform: translate(3px, -1px); }
      100% { clip-path: inset(30% 0 40% 0); transform: translate(-2px, 1px); }
    }

    .schedule-card:hover .event-title {
      animation: text-glitch 0.25s ease;
    }

    @keyframes text-glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); color: var(--accent-cyan); }
      40% { transform: translate(2px, -1px); color: var(--accent-magenta); }
      60% { transform: translate(-1px, -1px); }
      80% { transform: translate(1px, 1px); }
      100% { transform: translate(0); color: #ffffff; }
    }

    @media (max-width: 640px) {
      .schedule-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .details {
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-container">
      <span class="badge">ИС-252/4</span>
      <span class="badge">2 КУРС • 3 СЕМЕСТР</span>
    </div>
    <h1>Расписание Занятий</h1>
    <p class="subtitle">Казахский университет технологий и бизнеса им. К. Кулажанова</p>
  </header>

  <!-- Переключатель дней недели -->
  <div class="tabs-container">
    <button class="tab-btn glitch-btn" id="tab-mon" data-text="ПН" onclick="selectDay('mon', this)">ПН</button>
    <button class="tab-btn glitch-btn" id="tab-tue" data-text="ВТ" onclick="selectDay('tue', this)">ВТ</button>
    <button class="tab-btn glitch-btn" id="tab-wed" data-text="СР" onclick="selectDay('wed', this)">СР</button>
    <button class="tab-btn glitch-btn" id="tab-thu" data-text="ЧТ" onclick="selectDay('thu', this)">ЧТ</button>
    <button class="tab-btn glitch-btn" id="tab-fri" data-text="ПТ" onclick="selectDay('fri', this)">ПТ</button>
    <button class="tab-btn glitch-btn" id="tab-sat" data-text="СБ" onclick="selectDay('sat', this)">СБ</button>
  </div>

  <div class="day-info">
    <span id="currentDayLabel">День</span>
    <span id="classCountLabel">0 пар</span>
  </div>

  <!-- Список пар -->
  <div id="scheduleContainer" class="schedule-container"></div>

  <script>
    const scheduleData = {
      mon: [
        { time: "14:00 - 14:50", type: "Лабораторная", typeClass: "type-lab", title: "Основы информационных систем", teacher: "Амантаев Т.", room: "Ауд. 2/510" },
        { time: "15:00 - 15:50", type: "Лабораторная", typeClass: "type-lab", title: "Основы информационных систем", teacher: "Амантаев Т.", room: "Ауд. 2/510" },
        { time: "16:00 - 16:50", type: "Лекция", typeClass: "type-lec", title: "Теория вероятностей и мат. статистика", teacher: "Оспанова Т.Т.", room: "Ауд. 1/306" },
        { time: "17:00 - 17:50", type: "Лекция", typeClass: "type-lec", title: "Основы компьютерного моделирования", teacher: "Тайлақ Б.Е.", room: "Ауд. 1/306" }
      ],
      tue: [
        { time: "12:00 - 12:50", type: "Лекция", typeClass: "type-lec", title: "Компьютерные сети (Cisco)", teacher: "Сатаев Б.О.", room: "Ауд. 2/302" },
        { time: "13:00 - 13:50", type: "Лекция", typeClass: "type-lec", title: "Основы информационных систем", teacher: "Тайлақ Б.Е.", room: "Ауд. 2/302" },
        { time: "14:00 - 14:50", type: "Лабораторная", typeClass: "type-lab", title: "Инженерная и компьютерная графика", teacher: "Даян А.", room: "Ауд. 3/508" },
        { time: "15:00 - 15:50", type: "Лабораторная", typeClass: "type-lab", title: "Инженерная и компьютерная графика", teacher: "Даян А.", room: "Ауд. 3/508" }
      ],
      wed: [
        { time: "08:00 - 08:50", type: "Лабораторная", typeClass: "type-lab", title: "Основы компьютерного моделирования", teacher: "Саттыкова У.", room: "Ауд. 3/503" },
        { time: "09:00 - 09:50", type: "Лабораторная", typeClass: "type-lab", title: "Основы компьютерного моделирования", teacher: "Саттыкова У.", room: "Ауд. 3/503" },
        { time: "12:00 - 12:50", type: "Лекция", typeClass: "type-lec", title: "Инженерная и компьютерная графика", teacher: "Токишева Г.С.", room: "Ауд. 3/501" }
      ],
      thu: [
        { time: "14:00 - 14:50", type: "Практика", typeClass: "type-prac", title: "Физическая культура", teacher: "Сатбаев Е.К.", room: "Спортзал" },
        { time: "15:00 - 15:50", type: "Практика", typeClass: "type-prac", title: "Физическая культура", teacher: "Сатбаев Е.К.", room: "Спортзал" }
      ],
      fri: [],
      sat: [
        { time: "10:00 - 10:50", type: "Лабораторная", typeClass: "type-lab", title: "Компьютерные сети (Cisco)", teacher: "Сеилов А.", room: "Ауд. 3/515" },
        { time: "11:00 - 11:50", type: "Лабораторная", typeClass: "type-lab", title: "Компьютерные сети (Cisco)", teacher: "Сеилов А.", room: "Ауд. 3/515" },
        { time: "12:00 - 12:50", type: "Практика", typeClass: "type-prac", title: "Теория вероятностей и мат. статистика", teacher: "Нуралбаева Д.Б.", room: "Ауд. 3/509" },
        { time: "13:00 - 13:50", type: "Практика", typeClass: "type-prac", title: "Теория вероятностей и мат. статистика", teacher: "Нуралбаева Д.Б.", room: "Ауд. 3/509" }
      ]
    };

    const dayNames = {
      mon: "Понедельник",
      tue: "Вторник",
      wed: "Среда",
      thu: "Четверг",
      fri: "Пятница",
      sat: "Суббота"
    };

    let currentActiveDay = 'mon';

    function selectDay(dayKey, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      currentActiveDay = dayKey;
      
      const targetBtn = btn || document.getElementById(`tab-${dayKey}`);
      if(targetBtn) targetBtn.classList.add('active');

      renderSchedule();
    }

    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      const dayClasses = scheduleData[currentActiveDay];

      document.getElementById('currentDayLabel').innerText = dayNames[currentActiveDay];
      document.getElementById('classCountLabel').innerText = `${dayClasses ? dayClasses.length : 0} пар(ы)`;

      if (!dayClasses || dayClasses.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p style="font-size: 1.5rem; margin-bottom: 8px;">🎉</p>
            <p style="font-weight: 700; color: #fff;">Занятий нет</p>
            <p style="font-size: 0.85rem; margin-top: 4px;">Отличный день для отдыха и самостоятельной работы!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = dayClasses.map(item => `
        <div class="schedule-card">
          <div class="time-box">
            <span class="time">${item.time}</span>
            <span class="type-badge ${item.typeClass}">${item.type}</span>
          </div>
          <div class="details">
            <div class="event-title">${item.title}</div>
            <div class="event-teacher">👨‍🏫 ${item.teacher}</div>
          </div>
          <div class="room-tag">${item.room}</div>
        </div>
      `).join('');
    }

    // Авто-определение текущего дня недели
    function initCurrentDay() {
      const dayIndex = new Date().getDay(); // 0 - Вс, 1 - Пн, ...
      const daysMap = ['mon', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
      const todayKey = daysMap[dayIndex] || 'mon';
      selectDay(todayKey);
    }

    // Инициализация
    initCurrentDay();
  </script>
</body>
</html>
